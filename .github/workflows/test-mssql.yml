on:
  schedule:
    # daily full sweep; the push trigger only covers the changed module
    - cron: '0 10 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - 'mssql/**'
      - '.github/workflows/test-mssql.yml'
  pull_request:
    paths:
      - 'mssql/**'
      - '.github/workflows/test-mssql.yml'
  workflow_dispatch:
name: "Tests MSSQL"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      mssql:
        # pinned by digest: unofficial single-maintainer image, tag :latest is mutable
        image: 'mcmoe/mssqldocker@sha256:265c567f39f827d2e6e491e7704c4fc137235360a731875b3182d8c0c24ece44'
        ports:
          - '1433:1433'
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: MsSql!1234
          MSSQL_DB: master
          MSSQL_USER: sa
          MSSQL_PASSWORD: MsSql!1234
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -U sa -P $SA_PASSWORD -Q 'select 1' -b -o /dev/null" --health-interval 1s --health-timeout 30s --health-start-period 10s --health-retries 20
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ matrix.go-version }}'
          check-latest: true
          cache-dependency-path: mssql/go.sum
      - name: Run Test
        env:
          MSSQL_DATABASE: master
          MSSQL_USERNAME: sa
          MSSQL_PASSWORD: MsSql!1234
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: ./mssql
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
