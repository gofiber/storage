on:
  schedule:
    # daily full sweep; the push trigger only covers the changed module
    - cron: '0 10 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - 'dynamodb/**'
      - '.github/workflows/test-dynamodb.yml'
  pull_request:
    paths:
      - 'dynamodb/**'
      - '.github/workflows/test-dynamodb.yml'
  workflow_dispatch:
name: "Tests DynamoDB"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    # No service container: the tests start their own DynamoDB Local through
    # testcontainers and connect to the address it reports, so the one that used
    # to run here on 8000 was never connected to. It only spent an ECR Public
    # pull that the pull the tests actually depend on then went without.
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ matrix.go-version }}'
          check-latest: true
          cache-dependency-path: dynamodb/go.sum
      - name: Run Test
        env:
          TEST_DYNAMODB_IMAGE: "public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest"
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: ./dynamodb
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
