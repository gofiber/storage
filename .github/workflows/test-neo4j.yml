on:
  schedule:
    # daily full sweep; the push trigger only covers the changed module
    - cron: '0 10 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - 'neo4j/**'
      - '.github/workflows/test-neo4j.yml'
  pull_request:
    paths:
      - 'neo4j/**'
      - '.github/workflows/test-neo4j.yml'
  workflow_dispatch:
name: "Tests Neo4j"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ matrix.go-version }}'
          check-latest: true
          cache-dependency-path: neo4j/go.sum
      - name: Run Test
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: ./neo4j
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
