name: Tests CloudflareKV
on:
  schedule:
    # daily full sweep; the push trigger only covers the changed module
    - cron: '0 10 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - 'cloudflarekv/**'
      - '.github/workflows/test-cloudflarekv.yml'
  pull_request:
    paths:
      - 'cloudflarekv/**'
      - '.github/workflows/test-cloudflarekv.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: cloudflarekv/go.sum
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Start Wrangler Dev
        run: |
          .github/scripts/initialize-wrangler.sh
          cd cloudflarekv && npx wrangler dev &
          npx wait-on tcp:8787
      - name: Run Go Tests
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: cloudflarekv
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
