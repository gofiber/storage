on:
  schedule:
    # daily full sweep; the push trigger only covers the changed module
    - cron: '0 10 * * *'
  push:
    branches:
      - master
      - main
    paths:
      - 'nats/**'
      - '.github/workflows/test-nats.yml'
  pull_request:
    paths:
      - 'nats/**'
      - '.github/workflows/test-nats.yml'
  workflow_dispatch:
name: "Tests Nats Driver"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Tests:
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.x
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '${{ matrix.go-version }}'
          check-latest: true
          cache-dependency-path: nats/go.sum
      - name: Test Nats
        env:
          TEST_NATS_IMAGE: "public.ecr.aws/docker/library/nats:2-alpine"
        uses: gofiber/.github/.github/actions/gotestsum@main
        with:
          working-directory: ./nats
          packages: ./...
          rerun-fails: '2'
          args: -race -count=1
